# Dedicated local broker for the reproducible experiments.
# This does not modify the machine-wide Mosquitto configuration.
listener 18884 127.0.0.1
allow_anonymous true
persistence false
sys_interval 1
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
max_inflight_messages 1000
max_queued_messages 10000
